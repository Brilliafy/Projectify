name: Continuous Integration

on:
  push:
    branches: [ "master", "main", "demo", "feature/**" ]
  pull_request:
    branches: [ "master", "main", "demo" ]

jobs:
  test-and-build:
    name: Lint, Test & Build Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            user-service/package-lock.json
            team-service/package-lock.json
            task-service/package-lock.json
            notification-service/package-lock.json

      # Frontend Validation
      - name: Validate Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run lint
          npm run build

      # User Service Validation
      - name: Validate User Service
        working-directory: ./user-service
        run: |
          npm ci
          npm run build
          npm test

      # Team Service Validation
      - name: Validate Team Service
        working-directory: ./team-service
        run: |
          npm ci
          npm test
          npm run build

      # Task Service Validation
      - name: Validate Task Service
        working-directory: ./task-service
        run: |
          npm ci
          npm test
          npm run build

      # Notification Service Validation
      - name: Validate Notification Service
        working-directory: ./notification-service
        run: |
          npm ci
          npm test
          npm run build
